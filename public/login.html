<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>/LoginMissionControl</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="login.css" class="css">
</head>

<body>
    <div class="main">
        <div class="form">
            <div class="container1">
                <div class="text1"> // AUTHENTICATION REQUIRED</div>
                <div class="heading1">ACCESS TERMINAL</div>
                <div class="description">Enter your credentials to resume mission control.</div>
            </div>
            <div class="container2">
                <div class="username">
                    <span class="userstyles"> > USERNAME</span>
                    <input class="credentials user_name" type="text" placeholder="operator_id">
                </div>
                <div class="password">
                    <span  class="userstyles"> > ACCESS_CODE</span>
                    <input class="credentials pass_word" type="password" placeholder="............">
                </div>
                <div class="forgot">
                    <div class="staylogged">
                        <input  class="checkbox" type="checkbox">
                        <label>STAY LOGGED IN</label>
                    </div>
                    <div class="forgotpin">FORGOT CODE?</div>
                </div>
            </div>

            <div class="container3">
                <div ><button class="initiatesession" type="submit"  > INITIATE SESSION -></button></div>
                <div class="noaccount">OR<br> NO ACCOUNT YET?
                    <span ><a class="register" href="signup.html">REGISTER OPERATOR</a></span>
                </div>
            </div>

        </div>
    </div>
    <script src="login.js"></script>
</body>

</html>
